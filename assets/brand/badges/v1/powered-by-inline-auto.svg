<svg xmlns="http://www.w3.org/2000/svg" width="160" height="32" viewBox="0 0 160 32" role="img" aria-label="Powered by Aurora">
  <title>Powered by Aurora</title>
  <style>.panel{fill:#fcfbff}.line{stroke:#d9d5e7}.ink{fill:#262139}.muted{fill:#655c79}@media(prefers-color-scheme:dark){.panel{fill:#141421}.line{stroke:#3a364f}.ink{fill:#f4f0ff}.muted{fill:#b7b0cc}.s0{stop-color:#43f4dc}.s1{stop-color:#8c83ff}.s2{stop-color:#ee82ed}}</style>
  <defs>
    <linearGradient id="edge" x1="0" y1="32" x2="160" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#43f4dc"/><stop offset=".5" stop-color="#8c83ff"/><stop offset="1" stop-color="#ee82ed"/></linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect class="panel line" x=".5" y=".5" width="159" height="31" rx="9"/>
  <rect class="breathe" x="3" y="3" width="154" height="26" rx="7" fill="none" stroke="url(#edge)" stroke-width="1.5" filter="url(#glow)" opacity=".24"/>
  <svg x="6" y="4" width="24" height="24" viewBox="0 0 128 128" fill="none" aria-hidden="true"><defs><linearGradient id="aurora-spectrum" x1="22" y1="100" x2="104" y2="31" gradientUnits="userSpaceOnUse"><stop class="s0" offset="0" stop-color="#007f91"/><stop class="s1" offset="0.5" stop-color="#5145cd"/><stop class="s2" offset="1" stop-color="#a72fa6"/></linearGradient></defs><g stroke="url(#aurora-spectrum)" stroke-linecap="round" stroke-linejoin="round"><g stroke-width="14"><path d="M21 104 59.4 23.2Q64 13 68.6 23.2L107 104M54 81H74"/></g></g>
</svg>
  <g font-family="Arial,Helvetica,sans-serif"><text x="36" y="20.5"><tspan class="muted" font-size="10.5">Powered by</tspan><tspan class="ink" dx="4" font-size="12" font-weight="600">Aurora</tspan></text></g>
</svg>
