# ── phase (PLAN.md §6) ──────────────────────────────────────────────────
- name: "phase: 0 reset"
  color: "e4e669"
  description: "Workspace, tooling and CI"
- name: "phase: 1 format"
  color: "e4e669"
  description: "Format and colour"
- name: "phase: 2 runtime"
  color: "e4e669"
  description: "Runtime and GOAT parity (critical path)"
- name: "phase: 3 bindings"
  color: "e4e669"
  description: "Element, Vue and unplugin"
- name: "phase: 4 generators"
  color: "e4e669"
