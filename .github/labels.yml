# Source of truth for the repo's issue and PR labels.
# `.github/workflows/labels.yml` syncs this file to GitHub: labels not listed here are deleted,
# and `from_name` renames a GitHub default label so issues already using it keep it.
#
# Every issue gets one `type:`, and usually one `pkg:` and one `phase:`.
# `pkg:` labels are also added to PRs automatically from changed paths (`.github/labeler.yml`).

# ── type ────────────────────────────────────────────────────────────────
- name: "type: bug"
  color: "d73a4a"
  description: "Something renders, builds or behaves wrongly"
  from_name: "bug"
- name: "type: feature"
  color: "0e8a16"
  description: "New capability"
  from_name: "enhancement"
- name: "type: improvement"
  color: "2ea44f"
  description: "Better version of something that already works"
- name: "type: docs"
  color: "0075ca"
  description: "Docs, ADRs, README or PLAN"
  from_name: "documentation"
- name: "type: perf"
  color: "fbca04"
  description: "Frame time, bundle size or memory"
- name: "type: refactor"
  color: "c5def5"
  description: "Code change with no behaviour change"
- name: "type: test"
  color: "bfd4f2"
  description: "Tests, goldens or the browser harness"
- name: "type: chore"
  color: "ededed"
  description: "Tooling, dependencies or housekeeping"
- name: "type: ci"
  color: "5319e7"
  description: "GitHub Actions, Pages deploy or release pipeline"
- name: "type: security"
  color: "b60205"
  description: "Security issue or hardening"

