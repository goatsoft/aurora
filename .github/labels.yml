# ── priority ────────────────────────────────────────────────────────────
- name: "priority: critical"
  color: "b60205"
  description: "Broken for users or blocks a release; drop everything"
- name: "priority: high"
  color: "d93f0b"
  description: "Next up"
- name: "priority: medium"
  color: "fbca04"
  description: "Planned"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

# ── status ──────────────────────────────────────────────────────────────
- name: "status: triage"
  color: "ffffff"
  description: "Needs a type, package and priority"
- name: "status: blocked"
  color: "000000"
  description: "Waiting on something outside this issue"
- name: "status: needs design"
  color: "d4c5f9"
  description: "Needs a decision or ADR before work starts"
- name: "status: question"
  color: "d876e3"
  description: "Needs more information"
  from_name: "question"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
  from_name: "duplicate"
- name: "status: wontfix"
  color: "ffffff"
  description: "Won't be worked on"
  from_name: "wontfix"
- name: "status: invalid"
  color: "e4e669"
  description: "Not a real issue"
  from_name: "invalid"

# ── community / release ─────────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Small and well scoped; good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "breaking change"
  color: "b60205"
  description: "Changes a public API or the .aurora format; needs a major changeset"
- name: "skip changeset"
  color: "ededed"
  description: "No release note needed"
