name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Vitest browser mode
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify

      # A golden image that no longer matches is written next to it as <name>.actual.png. Keep
      # them, so a change rendered on CI's SwiftShader can be reviewed and committed.
      - name: Upload changed golden images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: packages/core/test/golden/*.actual.png
          if-no-files-found: ignore
