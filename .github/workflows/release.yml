name: Release

# On main, after CI passes on the same commit:
# - pending changesets: open or update the "Version Packages" PR;
# - nothing left to version: publish any @goatsoft/* version that isn't on npm yet
#   (scripts/publish.ts), then tag it and create its GitHub Release.
# Publishing uses npm trusted publishing (OIDC from the `npm` environment): no token, and every
# version carries provenance.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each package's trusted publisher on npm names this workflow and environment.
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # No registry-url: that writes an .npmrc expecting a token, and publishing uses OIDC instead.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
