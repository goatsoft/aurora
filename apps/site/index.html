<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafd" media="(prefers-color-scheme: light)" />
    <script data-eager>
      try {
        const theme = localStorage.getItem('aurora:theme')
        document.documentElement.dataset.theme = theme === 'light' || (theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'
        document.documentElement.dataset.paused = localStorage.getItem('aurora:paused') === 'true' ? 'true' : 'false'
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      }
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.content = document.documentElement.dataset.theme === 'light' ? '#fafafd' : '#090a14'
      }
    </script>
    <!--head-->
  </head>
  <body>
    <div id="app"><!--app--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
